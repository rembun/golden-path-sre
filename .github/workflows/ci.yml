# This repo's pipeline. It does two things:
#   1. tests the golden-path kit itself (platform team's responsibility)
#   2. onboards the availability API through the reusable pipeline, exactly as a
#      product team would from their own repository
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kit:
    name: Golden-path kit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -r kit/slo/requirements.txt "./kit/telemetry/python[test]" pytest
      - name: SLO generator
        run: python -m unittest discover -s kit/slo/tests -v
      - name: Policy gate
        run: python -m unittest discover -s kit/pipeline/tests -v
      - name: Telemetry standard
        run: python -m pytest -q kit/telemetry/python/tests
      - name: Alerts fire on replayed incidents; dashboard PromQL is valid (promtool)
        run: |
          mkdir -p out
          python kit/slo/extract_rules.py platform/alerts/generated/availability-api-slo.yaml out/availability-api-slo.rules.yaml
          python kit/slo/extract_rules.py platform/alerts/availability-alerts.yaml out/availability-api-alerts.rules.yaml
          python kit/slo/generate_dashboard.py --spec kit/slo/availability-api.yaml \
            --output out/dashboard.yaml --queries-as-rules out/dashboard-queries.rules.yaml
          docker run --rm -v "$PWD:/work" -w /work --entrypoint promtool docker.io/prom/prometheus:v3.16.0 \
            check rules out/availability-api-alerts.rules.yaml out/dashboard-queries.rules.yaml
          docker run --rm -v "$PWD:/work" -w /work --entrypoint promtool docker.io/prom/prometheus:v3.16.0 \
            test rules kit/slo/tests/promtool/*.test.yaml

  availability-api:
    name: availability-api
    uses: ./.github/workflows/golden-path-service.yml
    with:
      # Onboarding through the kit in this same commit, so a kit change is tested by its own PR.
      kit-repository: ${{ github.repository }}
      kit-ref: ${{ github.sha }}
      service-name: availability-api
      service-path: services/availability-api
      dockerfile: services/availability-api/Dockerfile
      manifests-path: deploy
      deploy-script: scripts/ci-deploy.sh

apiVersion: v1
kind: ConfigMap
metadata:
  name: golden-path-alertmanager-overview
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  golden-path-alertmanager-overview.json: |
    {
      "uid": "golden-path-alertmanager",
      "title": "Golden Path / Alertmanager Overview",
      "tags": ["golden-path", "alertmanager"],
      "timezone": "utc",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "title": "Active Alerts",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 6,
            "w": 8,
            "x": 0,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(alertmanager_alerts{namespace=\"observability\",service=\"kps-kube-prometheus-stack-alertmanager\",state=\"active\"})",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": ["lastNotNull"],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "value"
          }
        },
        {
          "id": 2,
          "title": "Alerts Received Rate",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 8,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (status) (rate(alertmanager_alerts_received_total{namespace=\"observability\",service=\"kps-kube-prometheus-stack-alertmanager\"}[5m]))",
              "legendFormat": "{{status}}"
            }
          ]
        },
        {
          "id": 3,
          "title": "Notifications Sent Rate",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (integration) (rate(alertmanager_notifications_total{namespace=\"observability\",service=\"kps-kube-prometheus-stack-alertmanager\"}[5m]))",
              "legendFormat": "{{integration}}"
            }
          ]
        },
        {
          "id": 4,
          "title": "Failed Notifications Rate",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (integration) (rate(alertmanager_notifications_failed_total{namespace=\"observability\",service=\"kps-kube-prometheus-stack-alertmanager\"}[5m]))",
              "legendFormat": "{{integration}}"
            }
          ]
        }
      ]
    }

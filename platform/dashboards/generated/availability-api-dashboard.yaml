data:
  availability-api-slo.json: "{\n  \"uid\": \"slo-availability-api\",\n  \"title\": \"availability-api \\u00b7 SLO\",\n  \"description\": \"Generated from kit/slo/availability-api.yaml by kit/slo/generate_dashboard.py. Don't edit in Grafana.\",\n  \"tags\": [\n    \"golden-path\",\n    \"slo\",\n    \"availability-api\"\n  ],\n  \"timezone\": \"utc\",\n  \"editable\": false,\n  \"refresh\": \"30s\",\n  \"time\": {\n    \"from\": \"now-3h\",\n    \"to\": \"now\"\n  },\n  \"schemaVersion\": 39,\n  \"version\": 1,\n  \"annotations\": {\n    \"list\": []\n  },\n  \"templating\": {\n    \"list\": []\n  },\n  \"links\": [\n    {\n      \"title\": \"Runbook\",\n      \"type\": \"link\",\n      \"url\": \"https://github.com/rembun/golden-path-sre/blob/main/docs/runbooks/dependency-failure.md\",\n      \"targetBlank\": true,\n      \"icon\": \"doc\"\n    }\n  ],\n  \"panels\": [\n    {\n      \"type\": \"row\",\n      \"title\": \"SLO: Availability requests succeed within 300 milliseconds\",\n      \"collapsed\": false,\n      \"panels\": [],\n      \"id\": 1,\n      \"gridPos\": {\n        \"h\": 1,\n        \"w\": 24,\n        \"x\": 0,\n        \"y\": 0\n      }\n    },\n    {\n      \"type\": \"stat\",\n      \"title\": \"Error budget left\",\n      \"description\": \"Share of the 30d error budget (0.15% of requests) not yet used. Below 0: budget exhausted, the error-budget policy applies. Long windows are evaluated every 5 minutes, so this fills in within 5 minutes of startup. In the local lab, chaos and storm runs make up most of the traffic, so expect this to be far below 0 after them: that is the maths working, not a bug.\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"prometheus\"\n          },\n          \"expr\": \"1 - (slo:availability_api:error_ratio:rate30d / 0.0015)\",\n          \"instant\": true,\n          \"range\": false\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"percentunit\",\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\": \"red\",\n                \"value\": null\n              },\n              {\n                \"color\": \"orange\",\n                \"value\": 0\n              },\n              {\n                \"color\": \"green\",\n                \"value\": 0.25\n              }\n            ]\n          },\n          \"color\": {\n            \"mode\": \"thresholds\"\n          },\n          \"decimals\": 1\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"reduceOptions\": {\n          \"calcs\": [\n            \"lastNotNull\"\n          ],\n          \"fields\": \"\",\n          \"values\": false\n        },\n        \"colorMode\": \"background\",\n        \"graphMode\": \"none\",\n        \"textMode\": \"value\",\n        \"justifyMode\": \"center\",\n        \"orientation\": \"auto\"\n      },\n      \"id\": 2,\n      \"gridPos\": {\n        \"h\": 5,\n        \"w\": 6,\n        \"x\": 0,\n        \"y\": 1\n      }\n    },\n    {\n      \"type\": \"stat\",\n      \"title\": \"SLI over 30d\",\n      \"description\": \"Share of good requests (not 5xx and under 300 ms). Target 99.85%. Fills in within 5 minutes of startup.\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"prometheus\"\n          },\n          \"expr\": \"1 - slo:availability_api:error_ratio:rate30d\",\n          \"instant\": true,\n          \"range\": false\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"percentunit\",\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\": \"red\",\n                \"value\": null\n              },\n              {\n                \"color\": \"green\",\n                \"value\": 0.9985\n              }\n            ]\n          },\n          \"color\": {\n            \"mode\": \"thresholds\"\n          },\n          \"decimals\": 3\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"reduceOptions\": {\n          \"calcs\": [\n            \"lastNotNull\"\n          ],\n          \"fields\": \"\",\n          \"values\": false\n        },\n        \"colorMode\": \"background\",\n        \"graphMode\": \"none\",\n        \"textMode\": \"value\",\n        \"justifyMode\": \"center\",\n        \"orientation\": \"auto\"\n      },\n      \"id\": 3,\n      \"gridPos\": {\n        \"h\": 5,\n        \"w\": 6,\n        \"x\": 6,\n        \"y\": 1\n      }\n    },\n    {\n      \"type\": \"stat\",\n      \"title\": \"Burn rate (1h)\",\n      \"description\": \"1\\u00d7 spends the budget exactly over the SLO window. Higher is faster. 0 when there is no traffic (nothing is being spent).\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"prometheus\"\n          },\n          \"expr\": \"sum(slo:availability_api:burn_rate:rate1h >= 0) or vector(0)\",\n          \"instant\": true,\n          \"range\": false\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"suffix:\\u00d7\",\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\": \"green\",\n                \"value\": null\n              },\n              {\n                \"color\": \"orange\",\n                \"value\": 1\n              },\n              {\n                \"color\": \"red\",\n                \"value\": 6\n              }\n            ]\n          },\n          \"color\": {\n            \"mode\": \"thresholds\"\n          },\n          \"decimals\": 1\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"reduceOptions\": {\n          \"calcs\": [\n            \"lastNotNull\"\n          ],\n          \"fields\": \"\",\n          \"values\": false\n        },\n        \"colorMode\": \"background\",\n        \"graphMode\": \"none\",\n        \"textMode\": \"value\",\n        \"justifyMode\": \"center\",\n        \"orientation\": \"auto\"\n      },\n      \"id\": 4,\n      \"gridPos\": {\n        \"h\": 5,\n        \"w\": 6,\n        \"x\": 12,\n        \"y\": 1\n      }\n    },\n    {\n      \"type\": \"stat\",\n      \"title\": \"Alerts firing\",\n      \"description\": \"SLO burn-rate pages and cause-based warnings for this service.\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"prometheus\"\n          },\n          \"expr\": \"count(ALERTS{alertstate=\\\"firing\\\", service=\\\"availability-api\\\"}) or vector(0)\",\n          \"instant\": true,\n          \"range\": false\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"none\",\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\": \"green\",\n                \"value\": null\n              },\n              {\n                \"color\": \"red\",\n                \"value\": 1\n              }\n            ]\n          },\n          \"color\": {\n            \"mode\": \"thresholds\"\n          }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"reduceOptions\": {\n          \"calcs\": [\n            \"lastNotNull\"\n          ],\n          \"fields\": \"\",\n          \"values\": false\n        },\n        \"colorMode\": \"background\",\n        \"graphMode\": \"none\",\n        \"textMode\": \"value\",\n        \"justifyMode\": \"center\",\n        \"orientation\": \"auto\"\n      },\n      \"id\": 5,\n      \"gridPos\": {\n        \"h\": 5,\n        \"w\": 6,\n        \"x\": 18,\n        \"y\": 1\n      }\n    },\n    {\n      \"type\": \"timeseries\",\n      \"title\": \"Error budget burn rate\",\n      \"description\": \"Pages fire when both windows of a pair cross their line: 5m/1h above 14.4\\u00d7, 30m/6h above 6\\u00d7.\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"prometheus\"\n          },\n          \"expr\": \"sum(slo:availability_api:burn_rate:rate5m >= 0) or vector(0)\",\n          \"legendFormat\": \"5m\"\n        },\n        {\n          \"refId\": \"B\",\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"prometheus\"\n          },\n          \"expr\": \"sum(slo:availability_api:burn_rate:rate30m >= 0) or vector(0)\",\n          \"legendFormat\": \"30m\"\n        },\n        {\n          \"refId\": \"C\",\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"prometheus\"\n          },\n          \"expr\": \"sum(slo:availability_api:burn_rate:rate1h >= 0) or vector(0)\",\n          \"legendFormat\": \"1h\"\n        },\n        {\n          \"refId\": \"D\",\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"prometheus\"\n          },\n          \"expr\": \"sum(slo:availability_api:burn_rate:rate6h\
    \ >= 0) or vector(0)\",\n          \"legendFormat\": \"6h\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"suffix:\\u00d7\",\n          \"custom\": {\n            \"drawStyle\": \"line\",\n            \"lineWidth\": 2,\n            \"fillOpacity\": 10,\n            \"showPoints\": \"never\",\n            \"spanNulls\": false,\n            \"thresholdsStyle\": {\n              \"mode\": \"dashed\"\n            }\n          },\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\": \"transparent\",\n                \"value\": null\n              },\n              {\n                \"color\": \"orange\",\n                \"value\": 6.0\n              },\n              {\n                \"color\": \"red\",\n                \"value\": 14.4\n              }\n            ]\n          },\n          \"color\": {\n            \"mode\": \"palette-classic\"\n          },\n          \"noValue\": \"No traffic\"\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"legend\": {\n          \"displayMode\": \"list\",\n          \"placement\": \"bottom\",\n          \"showLegend\": true\n        },\n        \"tooltip\": {\n          \"mode\": \"multi\",\n          \"sort\": \"desc\"\n        }\n      },\n      \"id\": 6,\n      \"gridPos\": {\n        \"h\": 8,\n        \"w\": 24,\n        \"x\": 0,\n        \"y\": 6\n      }\n    },\n    {\n      \"type\": \"row\",\n      \"title\": \"Traffic and latency\",\n      \"collapsed\": false,\n      \"panels\": [],\n      \"id\": 7,\n      \"gridPos\": {\n        \"h\": 1,\n        \"w\": 24,\n        \"x\": 0,\n        \"y\": 14\n      }\n    },\n    {\n      \"type\": \"timeseries\",\n      \"title\": \"Requests per second by status\",\n      \"description\": \"A sudden jump with 5xx usually means clients are retrying.\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"prometheus\"\n          },\n          \"expr\": \"sum by (http_response_status_code) (rate(http_server_request_duration_seconds_count{job=\\\"bookings/availability-api\\\"}[1m]))\",\n          \"legendFormat\": \"{{http_response_status_code}}\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"reqps\",\n          \"custom\": {\n            \"drawStyle\": \"line\",\n            \"lineWidth\": 2,\n            \"fillOpacity\": 10,\n            \"showPoints\": \"never\",\n            \"spanNulls\": false,\n            \"thresholdsStyle\": {\n              \"mode\": \"off\"\n            }\n          },\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\": \"green\",\n                \"value\": null\n              }\n            ]\n          },\n          \"color\": {\n            \"mode\": \"palette-classic\"\n          },\n          \"noValue\": \"No traffic\"\n        },\n        \"overrides\": [\n          {\n            \"matcher\": {\n              \"id\": \"byRegexp\",\n              \"options\": \"^2..$\"\n            },\n            \"properties\": [\n              {\n                \"id\": \"color\",\n                \"value\": {\n                  \"mode\": \"fixed\",\n                  \"fixedColor\": \"green\"\n                }\n              }\n            ]\n          },\n          {\n            \"matcher\": {\n              \"id\": \"byRegexp\",\n              \"options\": \"^4..$\"\n            },\n            \"properties\": [\n              {\n                \"id\": \"color\",\n                \"value\": {\n                  \"mode\": \"fixed\",\n                  \"fixedColor\": \"orange\"\n                }\n              }\n            ]\n          },\n          {\n            \"matcher\": {\n              \"id\": \"byRegexp\",\n              \"options\": \"^5..$\"\n            },\n            \"properties\": [\n              {\n                \"id\": \"color\",\n                \"value\": {\n                  \"mode\": \"fixed\",\n                  \"fixedColor\": \"red\"\n                }\n              }\n            ]\n          }\n        ]\n      },\n      \"options\": {\n        \"legend\": {\n          \"displayMode\": \"list\",\n          \"placement\": \"bottom\",\n          \"showLegend\": true\n        },\n        \"tooltip\": {\n          \"mode\": \"multi\",\n          \"sort\": \"desc\"\n        }\n      },\n      \"id\": 8,\n      \"gridPos\": {\n        \"h\": 8,\n        \"w\": 12,\n        \"x\": 0,\n        \"y\": 15\n      }\n    },\n    {\n      \"type\": \"timeseries\",\n      \"title\": \"Latency\",\n      \"description\": \"The line is the SLO threshold (300 ms).\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"prometheus\"\n          },\n          \"expr\": \"histogram_quantile(0.99, sum by (le) (rate(http_server_request_duration_seconds_bucket{job=\\\"bookings/availability-api\\\"}[5m]))) >= 0\",\n          \"legendFormat\": \"p99\"\n        },\n        {\n          \"refId\": \"B\",\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"prometheus\"\n          },\n          \"expr\": \"histogram_quantile(0.5, sum by (le) (rate(http_server_request_duration_seconds_bucket{job=\\\"bookings/availability-api\\\"}[5m]))) >= 0\",\n          \"legendFormat\": \"p50\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"s\",\n          \"custom\": {\n            \"drawStyle\": \"line\",\n            \"lineWidth\": 2,\n            \"fillOpacity\": 10,\n            \"showPoints\": \"never\",\n            \"spanNulls\": false,\n            \"thresholdsStyle\": {\n              \"mode\": \"dashed\"\n            }\n          },\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\": \"transparent\",\n                \"value\": null\n              },\n              {\n                \"color\": \"red\",\n                \"value\": 0.3\n              }\n            ]\n          },\n          \"color\": {\n            \"mode\": \"palette-classic\"\n          },\n          \"noValue\": \"No traffic\"\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"legend\": {\n          \"displayMode\": \"list\",\n          \"placement\": \"bottom\",\n          \"showLegend\": true\n        },\n        \"tooltip\": {\n          \"mode\": \"multi\",\n          \"sort\": \"desc\"\n        }\n      },\n      \"id\": 9,\n      \"gridPos\": {\n        \"h\": 8,\n        \"w\": 12,\n        \"x\": 12,\n        \"y\": 15\n      }\n    },\n    {\n      \"type\": \"row\",\n      \"title\": \"Dependencies and service-specific\",\n      \"collapsed\": false,\n      \"panels\": [],\n      \"id\": 10,\n      \"gridPos\": {\n        \"h\": 1,\n        \"w\": 24,\n        \"x\": 0,\n        \"y\": 23\n      }\n    },\n    {\n      \"type\": \"timeseries\",\n      \"title\": \"Venue-capacity calls by outcome\",\n      \"description\": \"Why availability checks fail. During an outage, circuit_open should dominate and real calls drop to almost nothing.\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"prometheus\"\n          },\n          \"expr\": \"sum by (outcome) (rate(capacity_requests_total{job=\\\"bookings/availability-api\\\"}[1m]))\",\n          \"legendFormat\": \"{{outcome}}\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"reqps\",\n          \"custom\": {\n            \"drawStyle\": \"line\",\n            \"lineWidth\": 2,\n            \"fillOpacity\": 10,\n            \"showPoints\": \"never\",\n            \"spanNulls\": false,\n            \"thresholdsStyle\": {\n              \"mode\": \"off\"\n            }\n          },\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\": \"green\",\n                \"value\": null\n              }\n            ]\n          },\n          \"color\": {\n            \"mode\": \"palette-classic\"\n          },\n          \"noValue\": \"No traffic\"\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"legend\": {\n          \"displayMode\": \"list\",\n          \"placement\": \"bottom\",\n          \"showLegend\": true\n        },\n        \"tooltip\": {\n          \"mode\": \"multi\",\n          \"sort\": \"desc\"\n        }\n      },\n      \"id\": 11,\n      \"gridPos\": {\n        \"h\": 8,\n        \"w\": 12,\n        \"x\": 0,\n        \"y\": 24\n      }\n    },\n    {\n      \"type\": \"state-timeline\",\n      \"title\": \"Circuit breaker state per pod\",\n      \"description\": \"Open: the pod is failing fast with 503 and protecting venue-capacity. Half-open: the next call will test whether venue-capacity is back; a pod with no traffic can stay half-open indefinitely, which is harmless.\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"prometheus\"\n          },\n          \"expr\": \"max by (instance) (capacity_circuit_state{job=\\\
    \"bookings/availability-api\\\"})\",\n          \"legendFormat\": \"{{instance}}\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"mappings\": [\n            {\n              \"type\": \"value\",\n              \"options\": {\n                \"0\": {\n                  \"text\": \"closed\",\n                  \"color\": \"green\",\n                  \"index\": 0\n                },\n                \"1\": {\n                  \"text\": \"half-open: next call is a trial\",\n                  \"color\": \"yellow\",\n                  \"index\": 1\n                },\n                \"2\": {\n                  \"text\": \"open\",\n                  \"color\": \"red\",\n                  \"index\": 2\n                }\n              }\n            }\n          ],\n          \"color\": {\n            \"mode\": \"fixed\",\n            \"fixedColor\": \"blue\"\n          },\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\": \"blue\",\n                \"value\": null\n              }\n            ]\n          },\n          \"custom\": {\n            \"lineWidth\": 0,\n            \"fillOpacity\": 80\n          }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"showValue\": \"auto\",\n        \"mergeValues\": true,\n        \"rowHeight\": 0.8,\n        \"alignValue\": \"center\",\n        \"legend\": {\n          \"displayMode\": \"list\",\n          \"placement\": \"bottom\",\n          \"showLegend\": false\n        },\n        \"tooltip\": {\n          \"mode\": \"single\"\n        }\n      },\n      \"id\": 12,\n      \"gridPos\": {\n        \"h\": 8,\n        \"w\": 12,\n        \"x\": 12,\n        \"y\": 24\n      }\n    }\n  ]\n}"

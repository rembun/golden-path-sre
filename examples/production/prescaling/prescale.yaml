# OPTIONAL PRODUCTION REFERENCE ONLY.
# This manifest is not applied by the Golden Path assessment Makefile.
# The example schedules are illustrative: raise the HPA minimum to 5 on Thursdays
# at 08:45 and restore it to 3 at 10:00, using Europe/London.
# Validate historical demand, per-pod capacity, startup/readiness time, cluster
# resources, database limits, and the business timezone before production use.
# Replica floors and schedules must be measured and justified; idle capacity has a cost.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: availability-api-prescaler
  namespace: bookings
  labels: { app.kubernetes.io/name: availability-api-prescaler }
---
# Least privilege: read and patch this one HPA, nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: availability-api-prescaler
  namespace: bookings
rules:
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    resourceNames: [availability-api]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: availability-api-prescaler
  namespace: bookings
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: availability-api-prescaler
subjects:
  - kind: ServiceAccount
    name: availability-api-prescaler
    namespace: bookings
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: availability-api-prescale-up
  namespace: bookings
  labels: { app.kubernetes.io/name: availability-api-prescaler }
spec:
  schedule: "45 8 * * 4"            # Thursdays 08:45: pods are ready well before 09:00
  timeZone: Europe/London           # assumption: launch time is UK time (DECISIONS.md Q9)
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        metadata:
          labels: { app.kubernetes.io/name: availability-api-prescaler }
        spec:
          serviceAccountName: availability-api-prescaler
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: prescale
              image: docker.io/library/python:3.12-slim
              command: ["python", "/scripts/prescale_hpa.py"]
              env:
                - { name: HPA_NAME, value: availability-api }
                - { name: MIN_REPLICAS, value: "5" }   # illustrative only; validate against the target HPA maximum
              resources:
                requests: { cpu: 10m, memory: 32Mi }
                limits: { memory: 64Mi }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: [ALL] }
              volumeMounts:
                - { name: script, mountPath: /scripts, readOnly: true }
          volumes:
            - name: script
              configMap: { name: availability-api-prescale-script }
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: availability-api-prescale-down
  namespace: bookings
  labels: { app.kubernetes.io/name: availability-api-prescaler }
spec:
  schedule: "0 10 * * 4"            # Thursdays 10:00: peak (~25 min) is long over
  timeZone: Europe/London
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        metadata:
          labels: { app.kubernetes.io/name: availability-api-prescaler }
        spec:
          serviceAccountName: availability-api-prescaler
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: prescale
              image: docker.io/library/python:3.12-slim
              command: ["python", "/scripts/prescale_hpa.py"]
              env:
                - { name: HPA_NAME, value: availability-api }
                - { name: MIN_REPLICAS, value: "3" }   # back to the normal floor (hpa.yaml)
              resources:
                requests: { cpu: 10m, memory: 32Mi }
                limits: { memory: 64Mi }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: [ALL] }
              volumeMounts:
                - { name: script, mountPath: /scripts, readOnly: true }
          volumes:
            - name: script
              configMap: { name: availability-api-prescale-script }

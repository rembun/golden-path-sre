# Test double for the venue-capacity dependency. One replica on purpose: its
# overload model (MAX_INFLIGHT) is per process, and one instance makes the
# retry-storm behaviour predictable.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: venue-capacity-fake
  namespace: bookings
  labels: { app.kubernetes.io/name: venue-capacity-fake }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: venue-capacity-fake }
  template:
    metadata:
      labels: { app.kubernetes.io/name: venue-capacity-fake }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: fake
          image: venue-capacity-fake:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8081
          env:
            - { name: MODE, value: normal }
            - { name: MAX_INFLIGHT, value: "40" }
            - name: CAPACITY_TOKEN
              valueFrom:
                secretKeyRef: { name: venue-capacity-fake, key: CAPACITY_TOKEN }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests: { cpu: 200m, memory: 64Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata:
  name: venue-capacity-fake
  namespace: bookings
  labels: { app.kubernetes.io/name: venue-capacity-fake }
spec:
  selector: { app.kubernetes.io/name: venue-capacity-fake }
  ports:
    - name: http
      port: 8081
      targetPort: http

# Applies the schema and seeds demo slots. Idempotent; run on every deploy
# before the new pods start, so schema changes land before the code that needs them.
apiVersion: batch/v1
kind: Job
metadata:
  name: availability-api-seed
  namespace: bookings
  labels: { app.kubernetes.io/name: availability-api, app.kubernetes.io/component: seed }
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: seed
          image: availability-api:local
          imagePullPolicy: Never
          command: ["python", "-m", "app.seed"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: availability-api, key: DATABASE_URL }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: availability-api
  namespace: bookings
  labels:
    app.kubernetes.io/name: availability-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: availability-api
  minReplicas: 3
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      selectPolicy: Max
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      selectPolicy: Max
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
